apiVersion: v1
kind: Namespace
metadata:
  name: etl-api

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etl-generator
  namespace: etl-api
  labels:
    app: etl-generator

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configmap-manager
  namespace: spark
  labels:
    app: etl-generator
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: etl-generator-configmap-binding
  namespace: spark
  labels:
    app: etl-generator
subjects:
- kind: ServiceAccount
  name: etl-generator
  namespace: etl-api
roleRef:
  kind: Role
  name: configmap-manager
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: etl-generator-config
  namespace: etl-api
  labels:
    app: etl-generator
data:
  PORT: "8080"
  DEFAULT_NAMESPACE: "spark"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: etl-generator
  namespace: etl-api
  labels:
    app: etl-generator
    version: v1.0.0
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: etl-generator
  template:
    metadata:
      labels:
        app: etl-generator
        version: v1.0.0
    spec:
      serviceAccountName: etl-generator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: etl-generator
        image: docker.io/balamaru/pysparkagent:1.1
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: etl-generator-config
              key: PORT
        - name: DEFAULT_NAMESPACE
          valueFrom:
            configMapKeyRef:
              name: etl-generator-config
              key: DEFAULT_NAMESPACE
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: etl-generator
  namespace: etl-api
  labels:
    app: etl-generator
spec:
  type: ClusterIP
  selector:
    app: etl-generator
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8080
  sessionAffinity: None

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: etl-generator-pdb
  namespace: etl-api
  labels:
    app: etl-generator
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: etl-generator

---
# (Optional) You can skip or delete this one if deployment can't be accesed
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: etl-generator-netpol
  namespace: etl-api
  labels:
    app: etl-generator
spec:
  podSelector:
    matchLabels:
      app: etl-generator
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
  - to:
    - namespaceSelector:
        matchLabels:
          name: spark

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: etl-generator-ingress
  namespace: etl-api
  labels:
    app: etl-generator
spec:
  tls:
  - hosts:
    - my.pyspark.agent
    secretName: my-tls-secret
  rules:
  - host: my.pyspark.agent
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: etl-generator
            port:
              number: 80
